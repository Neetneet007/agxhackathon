<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm, live</title>
<script>if (/[?&]drone=1/.test(location.search)) document.documentElement.classList.add('drone');</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --bg:#dfe9d6; --panel:rgba(255,255,255,.92); --ink:#1f2a24; --muted:#5b685f; --line:#cfd8cc; --accent:#2f7d4f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font:14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position:fixed; inset:0; }
  #stage canvas { display:block; }
  .bar { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); z-index:5; }
  .bar h1 { margin:0; font-size:16px; font-weight:650; }
  .bar .clock { font-variant-numeric:tabular-nums; font-weight:600; }
  .bar .mode { color:var(--muted); }
  .bar a { margin-left:auto; color:var(--accent); text-decoration:none; font-weight:600; }
  .bar a:hover { text-decoration:underline; }
  .banners { position:fixed; top:52px; left:50%; transform:translateX(-50%); z-index:6; display:flex; flex-direction:column; gap:6px; align-items:center; max-width:90vw; }
  .banner { padding:8px 14px; border-radius:8px; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,.18); }
  .banner.recall { background:#c0392b; color:#fff; }
  .banner.hold { background:#f59f00; color:#241a00; }
  .banner.offline { background:#343a40; color:#fff; }
  .panel { position:fixed; left:16px; top:64px; width:300px; max-width:calc(100vw - 32px); z-index:4;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .tr { padding:6px 8px; border-radius:8px; background:#f4f7f1; border:1px solid #e3e9df; }
  .tr .top { display:flex; align-items:center; gap:8px; font-weight:600; }
  .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  .tr .st { margin-left:auto; font-weight:500; color:var(--muted); font-size:12px; text-align:right; }
  .tr .task { color:var(--muted); font-size:12px; margin:2px 0 4px 19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fuel { margin-left:19px; height:6px; background:#dde4d9; border-radius:3px; overflow:hidden; }
  .fuel > i { display:block; height:100%; background:var(--accent); }
  .fuel.low > i { background:#e03131; }
  .tools { position:fixed; right:16px; bottom:16px; z-index:4; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:calc(100vw - 32px); }
  button { font:inherit; font-weight:600; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  button:hover { border-color:#9fb3a3; }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  html.drone .bar, html.drone .banners, html.drone .panel, html.drone .tools { display:none !important; }
  @media (max-width:640px) { .panel { top:auto; bottom:64px; width:calc(100vw - 32px); max-height:35vh; overflow:auto; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar">
  <h1>Farm, live</h1>
  <span class="clock" id="clock">--:--</span>
  <span class="mode" id="mode"></span>
  <a href="/">Back to status page</a>
</div>
<div class="banners" id="banners"></div>
<div class="panel" id="panel"></div>
<div class="tools" id="tools"><button id="btnFarm">Whole farm</button></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DRONE_CAM = new URLSearchParams(location.search).get('drone') === '1';
if (DRONE_CAM) document.documentElement.classList.add('drone');

// ---------- constants shared with live.html ----------
const TR_COLOR = ['#d9480f', '#1c7ed6', '#862e9c', '#0b7285'];
const JOB_COLOR = { till: 0x6b4423, seed: 0x2f9e44, spray: 0xae3ec9, mow: 0xe0a800 };
const JOB_Y = { till: 0.10, seed: 0.12, spray: 0.14, mow: 0.16 };
const BAD = ['NO_RESPONSE', 'GO_NOT_MOVING', 'DOWN'];

let farm = null;          // last /farm payload
let farmGroundCount = -1; // number of ground entries seen when farm was loaded
let lastState = null;
let offline = false;

// Same projection as live.html proj(); returns [east m, north m]. (live.html flips north for SVG; here z = -north.)
function proj(lat, lon) {
  const r = Math.PI / 180, h = farm.home;
  return [(lon - h.lon) * (111412.84 * Math.cos(lat * r) - 93.5 * Math.cos(3 * lat * r)),
          (lat - h.lat) * (111132.92 - 559.82 * Math.cos(2 * h.lat * r))];
}

// ---------- renderer / scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe6f5);
scene.fog = new THREE.Fog(0xcfe6f5, 2600, 6000);

const camera = new THREE.PerspectiveCamera(50, 1, 1, 6000);
camera.position.set(0, 400, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.05;
controls.screenSpacePanning = false;
if (DRONE_CAM) { controls.enabled = false; camera.fov = 70; camera.updateProjectionMatrix(); }

scene.add(new THREE.HemisphereLight(0xffffff, 0xb9a98a, 0.75));
const sun = new THREE.DirectionalLight(0xfff3dc, 1.6);
sun.position.set(-250, 400, 200);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshLambertMaterial({ color: 0xcdb98f }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
ground.receiveShadow = true;
scene.add(ground);

let farmGroup = new THREE.Group();   // rebuilt when /farm changes
scene.add(farmGroup);
let covGroup = new THREE.Group();    // rebuilt when coverage changes
scene.add(covGroup);
const tractorGroup = new THREE.Group();
scene.add(tractorGroup);

let bounds = { cx: 0, cz: 0, r: 250 };
const fieldMeshes = new Map(); // name -> mesh

function disposeTree(obj) {
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) { if (m.map) m.map.dispose(); m.dispose(); }
    }
  });
}

// ---------- labels (canvas sprites, constant screen size) ----------
function makeLabel(heightFrac) {
  const canvas = document.createElement('canvas');
  const tex = new THREE.CanvasTexture(canvas);
  tex.generateMipmaps = false;
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, sizeAttenuation: false });
  const sp = new THREE.Sprite(mat);
  sp.visible = !DRONE_CAM;
  sp.renderOrder = 20;
  sp.userData = { canvas, tex, heightFrac, text: null, color: null };
  return sp;
}
function setLabel(sp, text, color) {
  const u = sp.userData;
  if (u.text === text && u.color === color) return;
  u.text = text; u.color = color;
  const c = u.canvas, ctx = c.getContext('2d');
  const font = '600 28px system-ui, -apple-system, Segoe UI, sans-serif';
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + 28, h = 44;
  c.width = Math.max(w, 8); c.height = h;
  ctx.font = font;
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(0, 0, c.width, h, 10); else ctx.rect(0, 0, c.width, h);
  ctx.fill();
  if (color) { ctx.fillStyle = color; ctx.fillRect(0, 0, 8, h); }
  ctx.fillStyle = '#1f2a24';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, color ? 16 : 14, h / 2 + 1);
  u.tex.needsUpdate = true;
  sp.scale.set(u.heightFrac * c.width / h, u.heightFrac, 1);
}

// ---------- farm geometry ----------
function ribbonFromPolyline(pts, width, y, color) {
  const pos = [];
  const hw = width / 2;
  for (let i = 0; i + 1 < pts.length; i++) {
    const [x0, z0] = pts[i], [x1, z1] = pts[i + 1];
    const dx = x1 - x0, dz = z1 - z0, len = Math.hypot(dx, dz);
    if (len < 0.01) continue;
    const px = -dz / len * hw, pz = dx / len * hw;
    // extend slightly so joints overlap
    const ex = dx / len * hw * 0.5, ez = dz / len * hw * 0.5;
    const a = [x0 - ex + px, y, z0 - ez + pz], b = [x0 - ex - px, y, z0 - ez - pz];
    const c = [x1 + ex + px, y, z1 + ez + pz], d = [x1 + ex - px, y, z1 + ez - pz];
    pos.push(...a, ...b, ...c, ...b, ...d, ...c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
  m.receiveShadow = true;
  return m;
}

function buildFarm() {
  scene.remove(farmGroup);
  disposeTree(farmGroup);
  farmGroup = new THREE.Group();
  scene.add(farmGroup);
  fieldMeshes.clear();
  if (!farm || !farm.home) return;

  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  const grow = (x, z) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); };
  grow(0, 0);

  // lanes (metres east/north of depot)
  for (const lane of farm.lanes || []) {
    if (!Array.isArray(lane) || lane.length < 2) continue;
    const pts = lane.map(p => [p.e, -p.n]);
    pts.forEach(p => grow(p[0], p[1]));
    farmGroup.add(ribbonFromPolyline(pts, 3, 0.03, 0x9c7a4d));
  }
  // gates
  for (const g of farm.gates || []) {
    for (const s of [-2.2, 2.2]) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.35, 2.2, 0.35), new THREE.MeshLambertMaterial({ color: 0x6d4c2f }));
      post.position.set(g.e + s, 1.1, -g.n);
      post.castShadow = true;
      farmGroup.add(post);
    }
    const bar = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.25, 0.25), new THREE.MeshLambertMaterial({ color: 0xf1e9d8 }));
    bar.position.set(g.e, 1.9, -g.n);
    farmGroup.add(bar);
    grow(g.e, -g.n);
  }

  // fields
  for (const f of farm.fields || []) {
    const pts = (f.boundary || []).map(([lon, lat]) => proj(lat, lon));
    if (pts.length < 3) continue;
    pts.forEach(p => grow(p[0], -p[1]));
    const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1]))); // (east, north)
    const geo = new THREE.ShapeGeometry(shape);
    geo.rotateX(-Math.PI / 2); // (x, north, 0) -> (x, 0, -north)
    const mat = new THREE.MeshLambertMaterial({ color: 0xc8c98a, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 0.05;
    mesh.receiveShadow = true;
    farmGroup.add(mesh);
    fieldMeshes.set(f.name, mesh);

    // outline
    const op = pts.map(p => new THREE.Vector3(p[0], 0.2, -p[1]));
    op.push(op[0].clone());
    farmGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(op), new THREE.LineBasicMaterial({ color: 0x5a6b3a })));

    // guidance lines
    for (const t of f.tracks || []) {
      const lp = (t.line || []).map(([lon, lat]) => { const q = proj(lat, lon); return new THREE.Vector3(q[0], 0.25, -q[1]); });
      if (lp.length < 2) continue;
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(lp),
        new THREE.LineDashedMaterial({ color: 0x7e3fb8, dashSize: 4, gapSize: 3 }));
      line.computeLineDistances();
      farmGroup.add(line);
    }

    // name label
    const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length, cn = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    const lab = makeLabel(0.02);
    setLabel(lab, String(f.name ?? ''), null);
    lab.position.set(cx, 4, -cn);
    farmGroup.add(lab);
  }

  // depot
  const bays = farm.bays || [];
  let bx = 0, bn = 0;
  if (bays.length) {
    bx = bays.reduce((a, b) => a + b.e, 0) / bays.length;
    bn = Math.min(...bays.map(b => b.n));
  }
  for (const b of bays) {
    grow(b.e, -b.n);
    const rect = new THREE.Mesh(new THREE.PlaneGeometry(5, 8), new THREE.MeshBasicMaterial({ color: 0xf3f0e6, transparent: true, opacity: 0.7, side: THREE.DoubleSide }));
    rect.rotation.x = -Math.PI / 2;
    rect.position.set(b.e, 0.08, -b.n);
    farmGroup.add(rect);
    const lab = makeLabel(0.017);
    setLabel(lab, String(b.id ?? ''), null);
    lab.position.set(b.e, 1.5, -b.n + 6);
    farmGroup.add(lab);
  }
  const barnZ = -bn + 22; // south = +z
  const barn = new THREE.Group();
  const wall = new THREE.Mesh(new THREE.BoxGeometry(18, 6, 12), new THREE.MeshLambertMaterial({ color: 0xb23a2e }));
  wall.position.y = 3; wall.castShadow = true; wall.receiveShadow = true;
  const tri = new THREE.Shape([new THREE.Vector2(-6.6, 0), new THREE.Vector2(6.6, 0), new THREE.Vector2(0, 4.2)]);
  const roofGeo = new THREE.ExtrudeGeometry(tri, { depth: 19, bevelEnabled: false });
  roofGeo.translate(0, 0, -9.5);
  const roof = new THREE.Mesh(roofGeo, new THREE.MeshLambertMaterial({ color: 0x6f6a63 }));
  roof.rotation.y = Math.PI / 2; roof.position.y = 6; roof.castShadow = true;
  const door = new THREE.Mesh(new THREE.BoxGeometry(7, 4.5, 0.2), new THREE.MeshLambertMaterial({ color: 0xf1e9d8 }));
  door.position.set(0, 2.25, -6.05);
  barn.add(wall, roof, door);
  barn.position.set(bx, 0, barnZ);
  farmGroup.add(barn);
  const tank = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 3.2, 16), new THREE.MeshLambertMaterial({ color: 0x3b82c4 }));
  tank.position.set(bx + 16, 1.6, barnZ - 2); tank.castShadow = true;
  farmGroup.add(tank);
  grow(bx - 12, barnZ + 8); grow(bx + 20, barnZ - 8);
  const dl = makeLabel(0.02);
  setLabel(dl, String(farm.depot || 'Depot'), null);
  dl.position.set(bx, 12, barnZ);
  farmGroup.add(dl);

  // framing
  const pad = 40;
  x0 -= pad; x1 += pad; z0 -= pad; z1 += pad;
  bounds = { cx: (x0 + x1) / 2, cz: (z0 + z1) / 2, r: Math.max(80, Math.hypot(x1 - x0, z1 - z0) / 2) };
  sun.target.position.set(bounds.cx, 0, bounds.cz);
  sun.position.set(bounds.cx - bounds.r * 0.6, bounds.r * 1.1, bounds.cz + bounds.r * 0.5);
  const s = sun.shadow.camera;
  s.left = -bounds.r; s.right = bounds.r; s.top = bounds.r; s.bottom = -bounds.r;
  s.near = 10; s.far = bounds.r * 4;
  s.updateProjectionMatrix();
  if (!framedOnce) { framedOnce = true; flyToFarm(true); }
}
let framedOnce = false;

// ---------- coverage ----------
let covSig = null;
function updateCoverage(cov) {
  const list = Array.isArray(cov) ? cov : [];
  let sig = String(list.length);
  for (const c of list) {
    const segs = Array.isArray(c.segs) ? c.segs : [];
    const l = segs.length ? segs[segs.length - 1] : [];
    sig += '|' + c.job + ':' + segs.length + ':' + (l[2] ?? '') + ',' + (l[3] ?? '') + ':' + c.widthM;
  }
  if (sig === covSig) return;
  covSig = sig;
  scene.remove(covGroup);
  disposeTree(covGroup);
  covGroup = new THREE.Group();
  scene.add(covGroup);

  const byType = new Map(); // type -> number[]
  for (const c of list) {
    const type = c.type in JOB_COLOR ? c.type : 'till';
    const w = Number(c.widthM) > 0 ? Number(c.widthM) : 3;
    const hw = w / 2;
    let arr = byType.get(type);
    if (!arr) { arr = []; byType.set(type, arr); }
    const y = JOB_Y[type];
    for (const s of Array.isArray(c.segs) ? c.segs : []) {
      if (!Array.isArray(s) || s.length < 4) continue;
      const dx = s[2] - s[0], dn = s[3] - s[1], len = Math.hypot(dx, dn);
      if (!(len > 0.01)) continue;
      // direction in (x, z): (dx, -dn); perpendicular: (dn, dx) normalised
      const px = dn / len * hw, pz = dx / len * hw;
      const ax = s[0] + px, az = -s[1] + pz, bx = s[0] - px, bz = -s[1] - pz;
      const cx = s[2] + px, cz = -s[3] + pz, dxx = s[2] - px, dz = -s[3] - pz;
      arr.push(ax, y, az, bx, y, bz, cx, y, cz, bx, y, bz, dxx, y, dz, cx, y, cz);
    }
  }
  for (const [type, arr] of byType) {
    if (!arr.length) continue;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
      color: JOB_COLOR[type], transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false,
      polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }));
    m.renderOrder = 2;
    covGroup.add(m);
  }
}

// ---------- tractors ----------
const tractors = new Map(); // id -> object
const lamb = (c) => new THREE.MeshLambertMaterial({ color: c });

function buildTractor(color) {
  const root = new THREE.Group();      // position + heading
  const model = new THREE.Group();     // forward = -z
  root.add(model);
  const paint = lamb(color);
  const dark = lamb(0x2b2f33);
  const add = (mesh, x, y, z) => { mesh.position.set(x, y, z); mesh.castShadow = true; model.add(mesh); return mesh; };
  add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.1, 2.6), paint), 0, 1.45, -1.2);          // hood
  add(new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.5, 4.4), lamb(0x3a3f44)), 0, 0.85, -0.1);  // chassis
  add(new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.7, 1.8), new THREE.MeshLambertMaterial({ color: 0xdfeaf2 })), 0, 2.3, 1.0); // cab
  add(new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.2, 2.1), paint), 0, 3.25, 1.0);            // roof
  const wheel = (r, wd) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, wd, 14), dark); m.rotation.z = Math.PI / 2; return m; };
  for (const s of [-1, 1]) {
    add(wheel(0.95, 0.7), s * 1.25, 0.95, 1.4);
    add(wheel(0.62, 0.5), s * 1.05, 0.62, -1.7);
  }
  // implement bar behind
  const barMat = new THREE.MeshLambertMaterial({ color: 0x777b7e });
  const bar = new THREE.Mesh(new THREE.BoxGeometry(1, 0.45, 0.9), barMat);
  bar.position.set(0, 0.7, 3.8); bar.castShadow = true;
  model.add(bar);
  const hitch = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 1.6), dark);
  hitch.position.set(0, 0.8, 2.9);
  model.add(hitch);
  // beacon
  const beaconMat = new THREE.MeshBasicMaterial({ color: 0x4dabf7 });
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 10), beaconMat);
  beacon.position.set(0, 3.7, 1.0);
  model.add(beacon);
  // service ring (padlock-like marker)
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.14, 8, 24), new THREE.MeshBasicMaterial({ color: 0xffd43b }));
  ring.rotation.x = Math.PI / 2; ring.position.set(0, 4.5, 1.0); ring.visible = false;
  model.add(ring);
  const lock = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.4), new THREE.MeshBasicMaterial({ color: 0xffd43b }));
  lock.position.set(0, 4.5, 1.0); lock.visible = false;
  model.add(lock);
  const label = makeLabel(0.022);
  label.position.set(0, 8, 0);
  root.add(label);
  return { root, model, bar, barMat, beaconMat, ring, lock, label, bad: false, shown: false,
           pos: new THREE.Vector3(), target: new THREE.Vector3(), heading: 0, targetHeading: 0, has: false, color };
}

function angleDiff(a, b) { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }
const trunc = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

function updateTractors(list) {
  const seen = new Set();
  list.forEach((t, i) => {
    const id = String(t.id ?? i);
    seen.add(id);
    let o = tractors.get(id);
    if (!o) {
      o = buildTractor(TR_COLOR[i % 4]);
      o.index = i;
      tractors.set(id, o);
      tractorGroup.add(o.root);
      o.root.visible = false;
    }
    const tel = t.tel;
    if (tel && typeof tel.e === 'number' && typeof tel.n === 'number') {
      o.target.set(tel.e, 0, -tel.n);
      o.targetHeading = (Number(tel.headingDeg) || 0) * Math.PI / 180;
      if (!o.has) { o.pos.copy(o.target); o.heading = o.targetHeading; o.has = true; }
      else if (o.pos.distanceTo(o.target) > 120) o.pos.copy(o.target);
      o.root.visible = true;
    }
    const w = Number(tel && tel.rig && tel.rig.tool && tel.rig.tool.widthM);
    o.bar.scale.x = w > 0 ? w : 2;
    const painting = !!(tel && tel.painting);
    o.barMat.color.set(painting ? 0xffd43b : 0x777b7e);
    o.barMat.emissive.set(painting ? 0x7a5c00 : 0x000000);
    const code = t.state && t.state.code;
    o.code = code;
    o.bad = BAD.includes(code);
    o.beaconColor = o.bad ? 0xe03131
      : code === 'WORKING' ? 0x37b24d
      : code === 'DRIVING' ? 0xf59f00
      : 0x4dabf7;
    const svc = !!(tel && tel.service);
    o.ring.visible = svc; o.lock.visible = svc;
    setLabel(o.label, trunc(id + (t.task ? ': ' + t.task : ''), 34), o.color);
  });
  for (const [id, o] of tractors) if (!seen.has(id)) { tractorGroup.remove(o.root); disposeTree(o.root); tractors.delete(id); }
}

// ---------- drone ----------
function buildDrone() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 1.6), lamb(0x222629));
  g.add(body);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(5, 0.2, 0.3), lamb(0x444a4f));
  const arm2 = arm.clone(); arm.rotation.y = Math.PI / 4; arm2.rotation.y = -Math.PI / 4;
  g.add(arm, arm2);
  const rotorMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, side: THREE.DoubleSide });
  const d = 1.75;
  for (const [x, z] of [[d, d], [-d, d], [d, -d], [-d, -d]]) {
    const r = new THREE.Mesh(new THREE.CircleGeometry(1.1, 16), rotorMat);
    r.rotation.x = -Math.PI / 2; r.position.set(x, 0.25, z);
    g.add(r);
  }
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff3b30 }));
  led.position.set(0, 0.1, -0.9); // front
  g.add(led);
  g.scale.setScalar(1.6);
  g.visible = false;
  return g;
}
const droneObj = buildDrone();
scene.add(droneObj);
const dr = { pos: new THREE.Vector3(), target: new THREE.Vector3(), has: false, heading: 0, lastE: null, lastN: null, tgtAlt: 12 };
function updateDrone(d) {
  if (!d || typeof d.e !== 'number' || typeof d.n !== 'number') return;
  const docked = d.status === 'docked';
  const alt = Number(d.altM);
  dr.tgtAlt = docked ? 12 : (alt > 1 ? alt : (isFinite(alt) && d.altM != null ? 40 : 40));
  if (!docked && !(alt > 1)) dr.tgtAlt = 40;
  dr.target.set(d.e, dr.tgtAlt, -d.n);
  dr.status = d.status; dr.mission = d.mission;
  if (!dr.has) {
    dr.pos.copy(dr.target); dr.has = true;
    dr.heading = (Number(d.headingDeg) || 0) * Math.PI / 180;
  } else {
    const dx = d.e - dr.lastE, dz = -(d.n - dr.lastN);
    if (Math.hypot(dx, dz) > 0.3) dr.targetHeading = Math.atan2(dx, -dz); // 0 = north (-z), clockwise
    else if (dr.targetHeading == null) dr.targetHeading = dr.heading;
  }
  if (dr.targetHeading == null) dr.targetHeading = dr.heading;
  dr.lastE = d.e; dr.lastN = d.n;
}

// ---------- overlay ----------
const $ = (id) => document.getElementById(id);
function reasonOf(x) {
  if (x == null) return '';
  if (typeof x === 'string') return x;
  return String(x.reason ?? x.text ?? x.message ?? x.label ?? x.why ?? x.id ?? '');
}
function renderBanners(s) {
  const box = $('banners');
  box.replaceChildren();
  const add = (cls, text) => { const d = document.createElement('div'); d.className = 'banner ' + cls; d.textContent = text; box.appendChild(d); };
  if (offline) add('offline', 'Runner offline, retrying');
  if (s && Array.isArray(s.recalls) && s.recalls.length) add('recall', 'Fleet recalled: ' + s.recalls.map(reasonOf).filter(Boolean).join('; '));
  if (s && Array.isArray(s.holds) && s.holds.length) add('hold', 'On hold: ' + s.holds.map(reasonOf).filter(Boolean).join('; '));
}
function renderPanel(list) {
  const p = $('panel');
  p.replaceChildren();
  list.forEach((t, i) => {
    const row = document.createElement('div'); row.className = 'tr';
    const top = document.createElement('div'); top.className = 'top';
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = TR_COLOR[i % 4];
    const nm = document.createElement('span'); nm.textContent = String(t.id ?? '') + (t.name ? ' ' + t.name : '');
    const st = document.createElement('span'); st.className = 'st'; st.textContent = (t.state && t.state.text) || '';
    top.append(dot, nm, st);
    const task = document.createElement('div'); task.className = 'task'; task.textContent = t.task ? String(t.task) : 'No task';
    task.title = t.task ? String(t.task) : '';
    const f = Number(t.fuelPct);
    const fuel = document.createElement('div'); fuel.className = 'fuel' + (f < 20 ? ' low' : '');
    const bar = document.createElement('i'); bar.style.width = (isFinite(f) ? Math.max(0, Math.min(100, f)) : 0) + '%';
    fuel.title = isFinite(f) ? 'Fuel ' + Math.round(f) + '%' : 'Fuel unknown';
    fuel.appendChild(bar);
    row.append(top, task, fuel);
    p.appendChild(row);
  });
}
let followBtnsKey = '';
function renderFollowButtons(list) {
  const key = list.map(t => t.id).join(',');
  if (key === followBtnsKey) return;
  followBtnsKey = key;
  const tools = $('tools');
  tools.querySelectorAll('button[data-follow]').forEach(b => b.remove());
  list.forEach(t => {
    const b = document.createElement('button');
    b.dataset.follow = String(t.id);
    b.textContent = 'Follow ' + t.id;
    b.addEventListener('click', () => toggleFollow(String(t.id)));
    tools.appendChild(b);
  });
  syncFollowButtons();
}
function syncFollowButtons() {
  $('tools').querySelectorAll('button[data-follow]').forEach(b => b.classList.toggle('on', b.dataset.follow === followId));
}

// ---------- camera ----------
let followId = null, blend = 0, fly = null;
const tmp = new THREE.Vector3();
function flyToFarm(instant) {
  followId = null; syncFollowButtons();
  const tgt = new THREE.Vector3(bounds.cx, 0, bounds.cz);
  const half = Math.tan(camera.fov * Math.PI / 360);
  const dist = bounds.r * 1.08 / Math.min(half, half * camera.aspect);
  const pos = new THREE.Vector3(bounds.cx, dist * 0.78, bounds.cz + dist * 0.62);
  if (instant) { camera.position.copy(pos); controls.target.copy(tgt); controls.update(); fly = null; }
  else fly = { pos, tgt };
}
function toggleFollow(id) {
  if (followId === id) { followId = null; blend = 0; syncFollowButtons(); return; }
  followId = id; blend = 1; fly = null; syncFollowButtons();
}
$('btnFarm').addEventListener('click', () => flyToFarm(false));
controls.addEventListener('start', () => { fly = null; });

// ---------- data polling ----------
async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
async function loadFarm() {
  try {
    const f = await getJSON('/farm');
    if (f && f.home && Array.isArray(f.fields)) { farm = f; buildFarm(); }
  } catch (e) { /* retried on next poll */ }
}
async function poll() {
  try {
    const s = await getJSON('/state');
    if (!s || typeof s !== 'object') throw new Error('bad state');
    offline = false;
    lastState = s;
    const tl = Array.isArray(s.tractors) ? s.tractors : [];
    $('clock').textContent = s.clock || '--:--';
    $('mode').textContent = s.mode === 'building' ? 'Tractors at home, job list being built' : 'Day running';
    const gcount = s.ground && typeof s.ground === 'object' ? Object.keys(s.ground).length : -1;
    if (!farm || (gcount >= 0 && farm && gcount !== farm.fields.length && gcount !== farmGroundCount)) {
      farmGroundCount = gcount;
      await loadFarm();
    }
    // field ground colours
    for (const [name, mesh] of fieldMeshes) {
      const g = s.ground && s.ground[name];
      const now = g && g.now;
      mesh.material.color.set(now === 'sown' ? 0x4a3322 : now === 'plowed' ? 0x8a5a34 : 0xc8c98a);
    }
    updateCoverage(s.coverage);
    updateTractors(tl);
    updateDrone(s.drone);
    renderPanel(tl);
    renderFollowButtons(tl);
    renderBanners(s);
  } catch (e) {
    offline = true;
    renderBanners(lastState);
  }
  setTimeout(poll, 250);
}

// ---------- render loop ----------
const clock = new THREE.Clock();
function resize() {
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  const k = 1 - Math.exp(-dt * 7);
  for (const o of tractors.values()) {
    if (!o.has) continue;
    o.pos.lerp(o.target, k);
    o.heading += angleDiff(o.heading, o.targetHeading) * k;
    o.root.position.copy(o.pos);
    o.model.rotation.y = -o.heading; // heading 0 = north (-z), clockwise: east (+x) at 90 deg
    const flashOn = !o.bad || Math.floor(t * 3) % 2 === 0;
    o.beaconMat.color.set(flashOn ? (o.beaconColor ?? 0x4dabf7) : 0x3a1010);
    if (o.ring.visible) o.ring.rotation.z += dt * 2;
  }
  // drone
  if (dr.has) {
    dr.pos.lerp(dr.target, 1 - Math.exp(-dt * 3));
    if (dr.targetHeading != null) dr.heading += angleDiff(dr.heading, dr.targetHeading) * (1 - Math.exp(-dt * 2.5));
    droneObj.position.copy(dr.pos);
    droneObj.rotation.y = -dr.heading;
    droneObj.visible = !DRONE_CAM;
    if (!DRONE_CAM) droneObj.children[droneObj.children.length - 1].material.color.set(Math.floor(t * 2) % 2 ? 0xff3b30 : 0x550000);
  }
  if (DRONE_CAM) {
    if (dr.has) {
      const h = Math.max(dr.pos.y, 4);
      // Over a field on a job (scanning, hovering over a tractor, spraying) the camera looks steeply down at
      // the ground it is checking; travelling to or from the job it looks further ahead to see where it is going.
      const onJob = !!dr.mission && !['returning', 'docked', 'charging'].includes(dr.status);
      const approaching = onJob && dr.status === 'flying' && !(dr.mission.progressPct > 0);     // still on its way to the job
      const want = (approaching ? 42 : onJob ? 60 : 38) * Math.PI / 180;
      dr.tilt = dr.tilt == null ? want : dr.tilt + (want - dr.tilt) * (1 - Math.exp(-dt * 1.5));
      const ahead = h / Math.tan(dr.tilt);
      camera.position.copy(dr.pos);
      camera.lookAt(dr.pos.x + Math.sin(dr.heading) * ahead, 0, dr.pos.z - Math.cos(dr.heading) * ahead);
    }
    renderer.render(scene, camera);
    return;
  }
  // camera
  if (fly) {
    camera.position.lerp(fly.pos, k * 0.7);
    controls.target.lerp(fly.tgt, k * 0.7);
    if (camera.position.distanceTo(fly.pos) < 1 && controls.target.distanceTo(fly.tgt) < 1) fly = null;
  } else if (followId && tractors.get(followId) && tractors.get(followId).has) {
    const o = tractors.get(followId);
    const delta = tmp.copy(o.pos).sub(controls.target).multiplyScalar(Math.min(1, k * 1.5));
    controls.target.add(delta);
    camera.position.add(delta);
    if (blend > 0) {
      // ease the camera behind the tractor (opposite its heading), then leave orbiting to the user
      const bx = o.pos.x - Math.sin(o.heading) * 38, bz = o.pos.z + Math.cos(o.heading) * 38;
      camera.position.lerp(new THREE.Vector3(bx, 22, bz), k * 0.8);
      blend -= dt;
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
frame();
loadFarm().then(poll);
</script>
</body>
</html>
